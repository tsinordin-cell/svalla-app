# Steg 0 i GPS-promptens modularisering (2026-08-19): 248 tester fanns men
# INGEN workflow korde dem — och safety-sviten for seaPathfinder hade varit
# rod pa main sedan 2026-05-27 utan att nagon markte det. Detta ar natet.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib
